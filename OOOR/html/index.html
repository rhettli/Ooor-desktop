<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ooor AI 助手</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" v-cloak>
  <aside id="side">
    <div class="brand">
      <div class="logo">L</div>
      <div class="brand-text">
        <div class="t">ooor AI 助手</div>
        <div class="s">v{{ version }} · 本地模型 · Vue {{ vueVersion }}</div>
      </div>
    </div>

    <section class="card">
      <div class="row">
        <span class="k">服务状态</span>
        <span class="badge" :class="running ? 'on' : 'off'">{{ running ? '运行中' : '未运行' }}</span>
      </div>
      <div class="hint mono">{{ baseUrl || '（未启动服务）' }}</div>
    </section>

    <section class="card">
      <div class="card-title">工具权限</div>
      <label class="switch">
        <input type="checkbox" v-model="allowWrite" @change="applyOptions" />
        <span class="track"><i></i></span>
        <span class="sw-text">允许写入 / 删除文件</span>
      </label>
      <label class="switch">
        <input type="checkbox" v-model="allowCmd" @change="applyOptions" />
        <span class="track"><i></i></span>
        <span class="sw-text">允许执行命令 / 脚本</span>
      </label>
      <label class="switch">
        <input type="checkbox" v-model="allowInternet" @change="applyOptions" />
        <span class="track"><i></i></span>
        <span class="sw-text">允许联网搜索 / 抓取网页</span>
      </label>
      <label class="switch">
        <input type="checkbox" v-model="trustAi" @change="applyOptions" />
        <span class="track"><i></i></span>
        <span class="sw-text">AI 自行判断（跳过确认）</span>
      </label>
      <div class="hint">{{ trustHint }}</div>
    </section>

    <section class="card">
      <div class="card-title">
        沙盒白名单
        <button class="mini" @click="addRoot">＋ 添加目录</button>
      </div>
      <ul class="roots">
        <li v-if="!roots.length" class="empty">（暂无白名单目录）</li>
        <li v-for="r in roots" :key="r">
          <span :title="r">{{ r }}</span>
          <button title="移出白名单" @click="removeRoot(r)">✕</button>
        </li>
      </ul>
      <div class="hint">模型只能读写白名单内的路径；下载目录等需手动加入（会记住）。</div>
    </section>

    <section class="card grow">
      <div class="card-title">当前已启用工具</div>
      <div class="tools">
        <span v-if="!tools.length">（发送第一条消息后加载）</span>
        <span v-for="t in tools" :key="t">{{ t }}</span>
      </div>
    </section>
  </aside>

  <main id="main">
    <header id="bar">
      <div class="title">对话</div>
      <div class="acts">
        <button @click="checkServer">检测服务</button>
        <button :disabled="!busy" @click="cancel">停止</button>
        <button @click="clearChat">清空对话</button>
      </div>
    </header>

    <div id="chat" ref="chat">
      <template v-for="(m, i) in msgs">
        <!-- 工具调用卡片 -->
        <details v-if="m.role === 'tool'" :key="'tool' + i" class="tool" :class="m.tool.ok ? 'ok' : 'fail'" :open="m.tool.open">
          <summary>
            <span class="dot"></span>
            <span class="name">{{ m.tool.name }}</span>
            <span class="meta">{{ m.tool.at }}{{ m.tool.ok ? '' : ' · 失败' }}</span>
          </summary>
          <div class="body">
            <template v-if="m.tool.args">
              <div class="lbl">参数</div>
              <pre class="args">{{ m.tool.args }}</pre>
            </template>
            <div class="lbl">{{ m.tool.ok ? '返回' : '错误' }}</div>
            <pre class="res">{{ m.tool.result }}</pre>
          </div>
        </details>

        <!-- 系统提示 -->
        <div v-else-if="m.role === 'system'" :key="'sys' + i" class="msg system">
          <div class="bubble" v-html="m.html"></div>
        </div>

        <!-- 用户 / 错误 -->
        <div v-else-if="m.role !== 'assistant'" :key="'msg' + i" class="msg" :class="m.role">
          <div class="av">{{ m.role === 'user' ? '你' : '!' }}</div>
          <div class="bubble"><div v-if="m.html" class="md" v-html="m.html"></div></div>
        </div>

        <!-- 助手：思考过程（独立卡片）与正文（气泡）分开展示 -->
        <div v-else :key="'asst' + i" class="msg assistant">
          <div class="av">AI</div>
          <div class="col">
            <details v-if="m.reasoning" class="think" open>
              <summary>思考过程</summary>
              <div class="think-body">{{ m.reasoning }}</div>
            </details>
            <div v-if="m.html" class="bubble"><div class="md" v-html="m.html"></div></div>
          </div>
        </div>
      </template>

      <!-- 流式输出中的助手：思考过程卡片 / 正文气泡逐字上屏 -->
      <div v-if="stream && (stream.reasoning || stream.text)" class="msg assistant streaming">
        <div class="av">AI</div>
        <div class="col">
          <details v-if="stream.reasoning" class="think" open>
            <summary>思考过程</summary>
            <div class="think-body">{{ stream.reasoning }}</div>
          </details>
          <div v-if="stream.text" class="bubble"><div class="md" v-html="renderMd(stream.text)"></div></div>
          <span v-if="!stream.text" class="caret"></span>
        </div>
      </div>

      <div v-if="showThinking" class="thinking">
        <span class="dots"><i></i><i></i><i></i></span>
        <span>正在思考…（可点右上「停止」中断）</span>
      </div>

      <div v-if="showChips" class="chips">
        <button v-for="p in prompts" :key="p" @click="usePrompt(p)">{{ p }}</button>
      </div>
    </div>

    <footer id="composer">
      <textarea id="input" ref="input" rows="1" v-model="input"
                placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"
                @input="autoGrow" @keydown.enter="onEnter"></textarea>
      <button id="send" class="primary" :disabled="busy" @click="send">发送</button>
    </footer>
  </main>
</div>

<script src="vue.js"></script>
<script src="app.js"></script>
</body>
</html>
